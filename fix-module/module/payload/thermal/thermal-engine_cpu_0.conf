# ============================================================================
# thermal-engine_cpu_0.conf  —— TB710FU (SM8650Q, 6 核 1+4+1)
#
# 双梯子设计（2026-08-28 重标定，取代此前的单结温梯子）：
#
#   [cpuN-...]    体感主控。sensor = skin-msm-therm-usr，即 oplus_shell_temp_compat.ko
#                 注册的 Horae 真实外壳温热区。负责长时间负载下的握持舒适度。
#   [cpuN-j-...]  硅片安全网。sensor = cpuss-N（结温）。阈值抬到真实硅限附近，
#                 只在极端情况兜底，日常不参与。
#
# thermal-engine 允许多个 monitor 段作用于同一 cooling device，取最严者生效。
#
# 标定依据（L1043，6 核满载 135 秒，thermal-engine 停机实测）：
#   skin-msm-therm-usr  32 → 37°C（缓慢单调，约 1°C/25s，未饱和）
#   skin-msm-therm      35 → 53°C（贴 SoC，比真实外壳温高约 16°C，不可作体感依据）
#   rear-tof-therm      全程恒定 29°C 纹丝不动 —— 并非传感器损坏，而是第三方模块
#                       extreme_gt 的 service.sh 开机往它写死 emul_temp=29500 永久钉住。
#                       联想原厂 cpu_0.conf 正是以这颗为主控，故原厂配置在本机不可用。
#   cpuss-0/2/3 稳态    80 / 83 / 84°C，尖峰 86°C（SD8Gen3 Tjmax 95~110，安全）
#
# 关键改动 vs 上一版：
#   1. 主控从结温（67°C 起）换成外壳温（46°C 起）。结温 2 秒就冲到 68°C，
#      导致一满载就降档：policy3 被压在 2035200/2323200/2572800（用户报的"2323/2570"）。
#      A/B 实测停掉温控后 policy3 +45%、policy0 +34%、policy5 +33~53%。
#   2. thresholds_clr 回差从 2°C 拉到 5°C，消除在阈值上反复横跳
#      （用户报的"有时候又是 2956"）。
#   3. action_info 降档梯度保持原厂序列不动。首档即硬件上限，等价于第一级只做预警。
#
# 注意：此文件必须经 payload/thermal/ + chcon vendor_configs_file + mount --bind 下发。
#       KernelSU 的 system/ 覆盖带 system_file 标签，thermal-engine 在 vendor 域会静默丢弃。
# ============================================================================

# ---------------------------------------------------------------------------
# 体感梯子（主控）—— 真实外壳温
# ---------------------------------------------------------------------------

[cpu0-0-0]
algo_type        monitor
sensor           skin-msm-therm-usr
sampling         1000
thresholds       46000      48000      50000      52000      56000
thresholds_clr   41000      43000      45000      47000      51000
actions          cpu-cluster0       cpu-cluster0       cpu-cluster0       cpu-cluster0       cpu-cluster0
action_info      2265600      1920000     1689600     1459200     1017600

[cpu1-2-0-0]
algo_type        monitor
sensor           skin-msm-therm-usr
sampling         1000
thresholds       46000      48000      50000      52000      54000      56000
thresholds_clr   41000      43000      45000      47000      49000      51000
actions          cpu-cluster1      cpu-cluster1       cpu-cluster1       cpu-cluster1       cpu-cluster1       cpu-cluster1
action_info      2956800      2515200      2246400      1920000      1708800      1286400

[cpu3-0-0]
algo_type        monitor
sensor           skin-msm-therm-usr
sampling         1000
thresholds       47000      49000      51000      53000      55000      57000
thresholds_clr   42000      44000      46000      48000      50000      52000
actions          cpu-cluster2       cpu-cluster2       cpu-cluster2       cpu-cluster2       cpu-cluster2       cpu-cluster2
action_info      2956800      2572800     2323200     2035200     1708800     1286400

[cpu5-0-0]
algo_type        monitor
sensor           skin-msm-therm-usr
sampling         1000
thresholds       48000      50000      52000      54000      58000
thresholds_clr   43000      45000      47000      49000      53000
actions          cpu-cluster3       cpu-cluster3        cpu-cluster3        cpu-cluster3        cpu-cluster3
action_info      3302400      2496000     2169600     2112000     1593600

# ---------------------------------------------------------------------------
# 硅片安全网 —— 结温，仅兜底
# 实测尖峰 86°C，第一档 90°C 留 4°C 余量，末档 96°C 仍低于内核 trip1(95°C) 之上的硬保护
# ---------------------------------------------------------------------------

[cpu0-j-0]
algo_type        monitor
sensor           cpuss-0
sampling         1000
thresholds       90000      93000      96000
thresholds_clr   85000      88000      91000
actions          cpu-cluster0       cpu-cluster0       cpu-cluster0
action_info      1920000      1459200     1017600

[cpu1-2-j-0]
algo_type        monitor
sensor           cpuss-1
sampling         1000
thresholds       90000      93000      96000
thresholds_clr   85000      88000      91000
actions          cpu-cluster1      cpu-cluster1       cpu-cluster1
action_info      2515200      1920000      1286400

[cpu3-j-0]
algo_type        monitor
sensor           cpuss-2
sampling         1000
thresholds       90000      93000      96000
thresholds_clr   85000      88000      91000
actions          cpu-cluster2       cpu-cluster2       cpu-cluster2
action_info      2572800      2035200     1286400

[cpu5-j-0]
algo_type        monitor
sensor           cpuss-3
sampling         1000
thresholds       90000      93000      96000
thresholds_clr   85000      88000      91000
actions          cpu-cluster3       cpu-cluster3        cpu-cluster3
action_info      2496000      2169600     1593600
