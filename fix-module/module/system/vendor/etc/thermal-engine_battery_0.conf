[MON-BATTERY-STANDBY]
algo_type        monitor
sensor           pm8550b-chg-therm
sampling         1000
thresholds       40000          43000      43800
thresholds_clr   38000          40000      43000
actions          battery       battery    battery
action_info      3               6          7
action_info      3               6         7

[MON-BATTERY-USER]
algo_type        monitor
sensor           skin-msm-therm
sampling         1000
thresholds       36000      40000      44000      48000
thresholds_clr   34000      36000      40000      44000
actions          battery       battery    battery   battery
action_info      11               17          17         21

# 联想平板 Pro GT 调优：充电时 CPU 小核限频触发点从 38°C 抬高到 52°C，
# 避免边充边用时小核长期被压在 2.03GHz（原厂 set_point 38000 在 skin 37~52°C
# 区间会持续限频，与 cpu-limit-guard 形成拉锯）。52°C 以上仍保留原限频兜底。
[THERM_CLUSTER-1_0]
algo_type        ss
sensor           skin-msm-therm
sampling         1000
device           cpu-cluster0
set_point        52000
set_point_clr    50000
device_max_limit 2035200
