[MON-BATTERY-STANDBY]
algo_type        monitor
sensor           pm8550b-chg-therm
sampling         1000
thresholds       40000          43000      43800
thresholds_clr   38000          40000      43000
actions          battery       battery    battery
action_info      3               6          7
action_info      3               6         7

[MON-BATTERY-USER]
algo_type        monitor
sensor           skin-msm-therm
sampling         1000
thresholds       42000      45000      49000      52000
thresholds_clr   39000      42000      46000      49000
actions          battery    battery    battery    battery
action_info      15         15         16         17

# 联想平板 Pro GT 调优：充电时 CPU 小核限频触发点从 38°C 抬高到 52°C（同 battery_0）。
[THERM_CLUSTER-1_0]
algo_type        ss
sensor           skin-msm-therm
sampling         1000
device           cpu-cluster0
set_point        52000
set_point_clr    50000
device_max_limit 2035200
