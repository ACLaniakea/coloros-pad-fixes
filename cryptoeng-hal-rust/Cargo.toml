[package]
name = "vendor_oplus_cryptoeng"
version = "1.0.0"
edition = "2021"
description = "ColorOS CryptoEng HAL 可复现重构（含 FindPhone compat + PMS + PKI/HKDF）"

[lib]
name = "vendor_oplus_cryptoeng"
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
base64 = "0.21"
rand = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
aes = "0.8"
rand_core = "0.6"
log = "0.4"
rsbinder = { version = "0.10", features = ["android_16"] }
async-trait = "0.1.92"
num-bigint = "0.5.1"
libc = "0.2.189"
num-traits = "0.2.19"
num-integer = "0.1.47"
webpki = "0.22.4"
rustls-pki-types = "1.15.1"
x509-parser = "0.18.1"
p256 = { version = "0.14.0", features = ["ecdsa"] }
ecdsa = "0.17.0"

[profile.release]
lto = true
strip = true
panic = "abort"

[build-dependencies]
rsbinder-aidl = "0.10"
